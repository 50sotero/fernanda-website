hero:
  greeting: "Olá, sou a Fernanda"
  tagline: "Psicóloga | Terapia Cognitivo-Comportamental"
  description: "Psicóloga brasileira atendendo pacientes na Europa, América do Norte e América do Sul. Ofereço atendimento online em português para brasileiros que vivem no exterior, ajudando-os a superar os desafios da vida longe de casa."

about:
  title: "Sobre Mim"
  paragraphs:
    - "Sou psicóloga brasileira formada pela Universidade Federal de Alagoas (UFAL), especializada em Terapia Cognitivo-Comportamental (TCC). Minha missão é oferecer atendimento psicológico de qualidade para pacientes brasileiros onde quer que estejam no mundo."
    - "Viver no exterior traz desafios únicos—adaptação a uma nova cultura, lidar com a distância da família, construir uma nova rede social. Eu entendo essas experiências e ofereço um espaço seguro onde você pode se expressar na sua língua nativa."
    - "Através de técnicas baseadas em evidências, ajudo meus pacientes a desenvolver habilidades de regulação emocional, superar ansiedade e depressão, e construir uma vida mais plena."
  highlights:
    - icon: "🌍"
      title: "Alcance Global"
      description: "Sessões online para brasileiros na Europa, América do Norte e América do Sul"
    - icon: "🧠"
      title: "Especialista em TCC"
      description: "Abordagem baseada em evidências com resultados comprovados"
    - icon: "💬"
      title: "Português Nativo"
      description: "Terapia na sua língua, respeitando sua cultura"

approach:
  title: "Minha Abordagem"
  intro: "A Terapia Cognitivo-Comportamental (TCC) é uma forma estruturada e orientada a objetivos de psicoterapia que foca na relação entre pensamentos, sentimentos e comportamentos. É um dos tratamentos mais pesquisados e eficazes para uma ampla gama de condições psicológicas."
  methods:
    - name: "Reestruturação Cognitiva"
      description: "Identificar e desafiar padrões de pensamento que contribuem para o sofrimento emocional."
    - name: "Ativação Comportamental"
      description: "Engajar-se gradualmente em atividades que trazem significado e prazer para combater a depressão."
    - name: "Técnicas de Exposição"
      description: "Confrontar situações temidas de forma segura para reduzir a ansiedade e aumentar a confiança."
    - name: "Integração de Mindfulness"
      description: "Desenvolver consciência do momento presente para gerenciar o estresse e melhorar a regulação emocional."
    - name: "Habilidades de Resolução de Problemas"
      description: "Aprender abordagens estruturadas para navegar os desafios da vida de forma eficaz."
    - name: "Prevenção de Recaídas"
      description: "Construir habilidades e estratégias duradouras para manter o progresso após o término da terapia."

