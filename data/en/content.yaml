hero:
  greeting: "Hello, I'm Fernanda"
  tagline: "Psychologist | Cognitive Behavioral Therapy"
  description: "Brazilian psychologist serving patients across Europe, North America, and South America. I provide online therapy in Portuguese for Brazilians living abroad, helping them navigate life's challenges while far from home."

about:
  title: "About Me"
  paragraphs:
    - "I am a Brazilian psychologist graduated from the Federal University of Alagoas (UFAL), specialized in Cognitive Behavioral Therapy (CBT). My mission is to provide quality psychological care to Brazilian patients wherever they are in the world."
    - "Living abroad brings unique challenges—adapting to a new culture, dealing with distance from family, building a new social network. I understand these experiences and offer a safe space where you can express yourself in your native language."
    - "Through evidence-based techniques, I help my patients develop emotional regulation skills, overcome anxiety and depression, and build a more fulfilling life."
  highlights:
    - icon: "🌍"
      title: "Global Reach"
      description: "Online sessions for Brazilians in Europe, North America, and South America"
    - icon: "🧠"
      title: "CBT Specialist"
      description: "Evidence-based approach with proven results"
    - icon: "💬"
      title: "Native Portuguese"
      description: "Therapy in your language, respecting your culture"

approach:
  title: "My Approach"
  intro: "Cognitive Behavioral Therapy (CBT) is a structured, goal-oriented form of psychotherapy that focuses on the relationship between thoughts, feelings, and behaviors. It is one of the most researched and effective treatments for a wide range of psychological conditions."
  methods:
    - name: "Cognitive Restructuring"
      description: "Identifying and challenging unhelpful thought patterns that contribute to emotional distress."
    - name: "Behavioral Activation"
      description: "Gradually engaging in activities that bring meaning and pleasure to combat depression and low motivation."
    - name: "Exposure Techniques"
      description: "Safely confronting feared situations to reduce anxiety and build confidence."
    - name: "Mindfulness Integration"
      description: "Developing present-moment awareness to manage stress and improve emotional regulation."
    - name: "Problem-Solving Skills"
      description: "Learning structured approaches to navigate life's challenges effectively."
    - name: "Relapse Prevention"
      description: "Building lasting skills and strategies to maintain progress after therapy ends."

