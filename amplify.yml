version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "Installing Hugo Extended..."
        - wget -O /tmp/hugo.tar.gz https://github.com/gohugoio/hugo/releases/download/v0.139.0/hugo_extended_0.139.0_linux-amd64.tar.gz
        - tar -xzf /tmp/hugo.tar.gz -C /tmp
        - chmod +x /tmp/hugo
        - sudo mv /tmp/hugo /usr/local/bin/hugo
        - hugo version
    build:
      commands:
        - echo "Building Hugo site..."
        - hugo --gc --minify
  artifacts:
    baseDirectory: public
    files:
      - '**/*'
  cache:
    paths:
      - resources/_gen/**
