{{ $content := index .Site.Data .Lang "content" }}

<section class="approach" id="approach">
  <div class="container">
    <h2 class="section-title">{{ $content.approach.title }}</h2>
    <div class="approach-content">
      <div class="approach-intro">
        <p>{{ $content.approach.intro }}</p>
      </div>
      <div class="approach-methods">
        {{ range $content.approach.methods }}
          <div class="method-card">
            <h3>{{ .name }}</h3>
            <p>{{ .description }}</p>
          </div>
        {{ end }}
      </div>
    </div>
  </div>
</section>
