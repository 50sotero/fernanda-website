{{ $content := index .Site.Data .Lang "content" }}

<section class="contact" id="contact">
  <div class="container">
    <h2 class="section-title">{{ $content.contact.title }}</h2>
    <p class="section-subtitle">{{ $content.contact.subtitle }}</p>
    
    <div class="contact-methods">
      <a href="mailto:{{ .Site.Params.email }}" class="contact-card">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
          <polyline points="22,6 12,13 2,6"></polyline>
        </svg>
        <span>{{ i18n "contact_email" }}</span>
      </a>
      
      <a href="{{ .Site.Params.instagram }}" target="_blank" rel="noopener noreferrer" class="contact-card instagram">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
          <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
          <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
        </svg>
        <span>@psicolisboa</span>
      </a>
    </div>
  </div>
</section>
