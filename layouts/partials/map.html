{{ $content := index .Site.Data .Lang "content" }}

<section class="global-practice" id="global-practice">
  <div class="container">
    <h2 class="section-title">{{ $content.map.title }}</h2>
    <p class="section-subtitle">{{ $content.map.subtitle }}</p>
    
    <div class="world-map-container">
      <div id="world-map"></div>
    </div>
    
    <div class="locations-list">
      {{ range $content.map.locations }}
        <div class="location-item">
          <span class="location-flag">{{ .flag }}</span>
          <span class="location-name">{{ .name }}</span>
        </div>
      {{ end }}
    </div>
  </div>
</section>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsvectormap/dist/css/jsvectormap.min.css">
<script src="https://cdn.jsdelivr.net/npm/jsvectormap"></script>
<script src="https://cdn.jsdelivr.net/npm/jsvectormap/dist/maps/world.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  const map = new jsVectorMap({
    selector: '#world-map',
    map: 'world',
    backgroundColor: 'transparent',
    zoomButtons: false,
    zoomOnScroll: false,
    draggable: false,
    regionStyle: {
      initial: {
        fill: '#c8e6c9',
        stroke: '#a5d6a7',
        strokeWidth: 0.5
      },
      hover: {
        fill: '#81c784',
        cursor: 'default'
      },
      selected: {
        fill: '#66bb6a'
      }
    },
    markersSelectable: false,
    markers: [
      { name: '{{ i18n "location_ireland" | default "Ireland" }}', coords: [53.1424, -7.6921] },
      { name: '{{ i18n "location_portugal" | default "Portugal" }}', coords: [39.3999, -8.2245] },
      { name: '{{ i18n "location_sweden" | default "Sweden" }}', coords: [60.1282, 18.6435] },
      { name: '{{ i18n "location_france" | default "France" }}', coords: [46.2276, 2.2137] },
      { name: '{{ i18n "location_usa" | default "United States" }}', coords: [39.8283, -98.5795] },
      { name: '{{ i18n "location_brazil" | default "Brazil" }}', coords: [-14.235, -51.9253] },
      { name: '{{ i18n "location_peru" | default "Peru" }}', coords: [-9.19, -75.0152] }
    ],
    markerStyle: {
      initial: {
        fill: '#2e7d32',
        stroke: '#ffffff',
        strokeWidth: 2,
        r: 8
      },
      hover: {
        fill: '#1b5e20',
        stroke: '#ffffff',
        r: 10
      }
    },
    markerLabelStyle: {
      initial: {
        fontFamily: 'Inter, sans-serif',
        fontSize: 12,
        fontWeight: 500,
        fill: '#424242'
      }
    },
    labels: {
      markers: {
        render: function(marker) {
          return marker.name;
        }
      }
    },
    focusOn: {
      x: 0.5,
      y: 0.5,
      scale: 1
    }
  });
});
</script>
