<footer class="site-footer">
  <div class="container">
    <div class="footer-content">
      <div class="footer-brand">
        <p class="footer-name">{{ .Site.Title }}</p>
        <p class="footer-tagline">{{ i18n "footer_tagline" }}</p>
      </div>
      
      <div class="footer-social">
        <a href="{{ .Site.Params.instagram }}" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
          </svg>
        </a>
      </div>
    </div>
    
    <div class="footer-bottom">
      <p>&copy; {{ now.Year }} {{ .Site.Params.author }}. {{ i18n "footer_rights" }}</p>
    </div>
  </div>
</footer>

<script>
document.querySelector('.mobile-menu-toggle').addEventListener('click', function() {
  document.querySelector('.nav-links').classList.toggle('active');
  this.classList.toggle('active');
});
</script>
